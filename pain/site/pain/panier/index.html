<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Mon panier — Le pain des voisins</title>
  <link rel="stylesheet" href="/pain/pain.css">
</head>
<body>
<main>
  <p><a href="/pain/">← Continuer mes achats</a></p>
  <h1>Mon panier</h1>
  <div id="content"><p class="empty">Chargement…</p></div>
</main>

<script src="/pain/pain.js"></script>
<script>
(async () => {
  const { cart, store, catalogue, checkout, euro, fmt, esc, infoHTML, INFO_KEY } = PAIN;
  const $c = document.getElementById('content');

  let cat;
  try { cat = await catalogue(); }
  catch { $c.innerHTML = '<p class="error">Impossible de charger le panier. Réessayez dans un instant.</p>'; return; }

  const MAX = cat.maxQuantite;
  const byId = new Map(cat.produits.map(p => [p.id, p]));

  // Retire les produits qui ne sont plus proposés
  const before = cart.items();
  const kept = before.filter(i => byId.has(i.id)).map(i => ({ ...i, qty: Math.min(i.qty, MAX) }));
  cart.save(kept);
  const removedNotice = kept.length < before.length
    ? '<p class="error">Certains produits ne sont plus disponibles et ont été retirés du panier.</p>' : '';

  if (!kept.length) {
    $c.innerHTML = removedNotice + '<p class="empty">Votre panier est vide. <a href="/pain/">Voir les produits</a></p>';
    return;
  }

  const saved = store.get(INFO_KEY, {});
  const dateOptions = cat.dates.map(d => `<option value="${d}">${fmt(d)}</option>`).join('');
  const slotOptions = cat.creneaux.map(h => `<option value="${h}">${h}</option>`).join('');

  $c.innerHTML = `
    ${removedNotice}
    <div class="lines" id="lines"></div>
    <div class="info">${infoHTML(cat)}</div>
    <form id="form" novalidate>
      <div class="field">
        <label for="client">Prénom et nom</label>
        <input type="text" id="client" autocomplete="name" maxlength="80" required value="${esc(saved.client || '')}">
      </div>
      <div class="row">
        <div class="field">
          <label for="etage">Étage</label>
          <input type="text" id="etage" inputmode="numeric" maxlength="20" placeholder="ex. 3 ou RDC" required value="${esc(saved.etage || '')}">
        </div>
        <fieldset class="field">
          <legend>Porte</legend>
          <div class="radios">
            <label><input type="radio" name="porte" value="Gauche" ${saved.porte === 'Gauche' ? 'checked' : ''}> Gauche</label>
            <label><input type="radio" name="porte" value="Droite" ${saved.porte === 'Droite' ? 'checked' : ''}> Droite</label>
          </div>
        </fieldset>
      </div>
      <div class="row">
        <div class="field">
          <label for="date">Date de livraison</label>
          <select id="date" required>${dateOptions}</select>
          <small>Pas de livraison pendant mes périodes de stage.</small>
        </div>
        <div class="field">
          <label for="heure">Heure souhaitée</label>
          <select id="heure" required>${slotOptions}</select>
          <small>Entre 8:00 et 12:00.</small>
        </div>
      </div>
      <p class="error" id="formError" role="alert"></p>
      <button type="submit" id="pay">Payer</button>
      <p class="note">Paiement sécurisé par Stripe. Facture émise par l'association Vraie Forêt.</p>
    </form>`;

  if (!cat.dates.length) {
    document.getElementById('pay').disabled = true;
    document.getElementById('formError').textContent = 'Aucune date de livraison n\'est disponible pour le moment.';
  }

  const $lines = document.getElementById('lines');
  const $pay = document.getElementById('pay');

  function render() {
    const items = cart.items();
    if (!items.length) { location.reload(); return; }
    const total = items.reduce((s, i) => s + byId.get(i.id).prix * i.qty, 0);
    $lines.innerHTML = items.map(i => {
      const p = byId.get(i.id);
      return `<div class="line" data-id="${esc(i.id)}">
        <div class="name">${esc(p.nom)}<small>${euro(p.prix)} l'unité</small></div>
        <input type="number" inputmode="numeric" min="1" max="${MAX}" value="${i.qty}" aria-label="Quantité">
        <span class="sum">${euro(p.prix * i.qty)}</span>
        <button type="button" class="rm" aria-label="Retirer ${esc(p.nom)}">✕</button>
      </div>`;
    }).join('') + `<div class="total"><span>Total</span><span>${euro(total)}</span></div>`;
    $pay.textContent = `Payer ${euro(total)}`;
  }
  render();

  $lines.addEventListener('change', e => {
    if (e.target.type !== 'number') return;
    const id = e.target.closest('.line').dataset.id;
    const q = Number(e.target.value);
    const $err = document.getElementById('formError');
    if (!Number.isInteger(q) || q < 1) { e.target.value = cart.qtyOf(id); return; }
    if (q > MAX) {
      $err.textContent = `${MAX} maximum par produit : je produis à la main, chez moi, et ma capacité de production est limitée.`;
      e.target.value = cart.qtyOf(id);
      return;
    }
    $err.textContent = '';
    cart.setQty(id, q);
    render();
  });
  $lines.addEventListener('click', e => {
    if (!e.target.classList.contains('rm')) return;
    cart.remove(e.target.closest('.line').dataset.id);
    render();
  });

  document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    const $err = document.getElementById('formError');
    const payload = {
      client: document.getElementById('client').value.trim(),
      etage: document.getElementById('etage').value.trim(),
      porte: (document.querySelector('input[name=porte]:checked') || {}).value,
      date: document.getElementById('date').value,
      heure: document.getElementById('heure').value,
      items: cart.items(),
    };
    if (!payload.client) return ($err.textContent = 'Indiquez votre prénom et votre nom.');
    if (!payload.etage) return ($err.textContent = 'Indiquez votre étage.');
    if (!payload.porte) return ($err.textContent = 'Indiquez votre porte : gauche ou droite.');

    store.set(INFO_KEY, { client: payload.client, etage: payload.etage, porte: payload.porte });
    $err.textContent = '';
    $pay.disabled = true;
    $pay.textContent = 'Redirection vers le paiement…';
    try {
      const { url } = await checkout(payload);
      location.href = url;
    } catch (err) {
      $err.textContent = err.message;
      $pay.disabled = false;
      render();
    }
  });
})();
</script>
</body>
</html>
