<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Le pain des voisins</title>
  <link rel="stylesheet" href="/pain/pain.css">
</head>
<body>
<main>
  <h1>Le pain des voisins</h1>
  <p class="sub">Fait à la main. Contactez-moi pour commander.</p>

  <div class="info">
    <p>📞 <a href="tel:+33A_REMPLIR">A_REMPLIR</a> — appelez-moi, ou envoyez-moi votre demande ci-dessous.</p>
  </div>

  <div class="grid" id="products">Chargement…</div>

  <form id="contact-form">
    <h2>Envoyer une demande</h2>
    <div class="field">
      <label for="nom">Votre nom</label>
      <input type="text" id="nom" name="nom" required maxlength="80" autocomplete="name">
    </div>
    <div class="field">
      <label for="message">Votre demande</label>
      <textarea id="message" name="message" required maxlength="300" rows="3" placeholder="Ex : 2 pains de campagne pour vendredi"></textarea>
    </div>
    <button type="submit">Envoyer par SMS</button>
    <p class="msg" id="form-msg" role="status"></p>
  </form>
</main>

<script src="/pain/pain.js"></script>
<script>
(async () => {
  const { catalogue, contact, euro, esc } = PAIN;
  const $products = document.getElementById('products');

  try {
    const cat = await catalogue();
    $products.innerHTML = cat.produits.length
      ? cat.produits.map(p => `
        <article class="card">
          ${p.photo ? `<img src="${esc(p.photo)}" alt="${esc(p.nom)}" loading="lazy">` : '<div class="noimg"></div>'}
          <div class="body">
            <div class="top"><h2>${esc(p.nom)}</h2><span class="price">${euro(p.prix)}</span></div>
            ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ''}
            <p class="allergens">Allergènes : ${p.allergenes.length ? esc(p.allergenes.join(', ')) : 'aucun des 14 allergènes majeurs'}</p>
          </div>
        </article>`).join('')
      : '<p class="empty">Aucun produit disponible pour le moment. Revenez bientôt !</p>';
  } catch {
    $products.innerHTML = '<p class="error">Impossible de charger les produits. Réessayez dans un instant.</p>';
  }

  const $form = document.getElementById('contact-form');
  const $msg = document.getElementById('form-msg');
  $form.addEventListener('submit', async e => {
    e.preventDefault();
    $msg.className = 'msg';
    $msg.textContent = 'Envoi…';
    const nom = document.getElementById('nom').value.trim();
    const message = document.getElementById('message').value.trim();
    try {
      await contact({ nom, message });
      $msg.className = 'msg ok';
      $msg.textContent = 'Envoyé ! Je vous réponds au plus vite.';
      $form.reset();
    } catch (err) {
      $msg.className = 'msg';
      $msg.textContent = err.message || "Échec de l'envoi. Réessayez, ou appelez-moi directement.";
    }
  });
})();
</script>
</body>
</html>
