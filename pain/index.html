<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Le pain des voisins</title>
  <link rel="stylesheet" href="/pain/pain.css">
</head>
<body>
<main>
  <h1>Le pain des voisins</h1>
  <p class="sub">Pétri, façonné et cuit avec amour au 16e, livré chez vous par ascenseur.</p>

  <div class="info">
    <p>📱 <a href="sms:+33643677814">Envoyez-moi un SMS au 06 43 67 78 14</a></p>
  </div>

  <div class="list" id="products">Chargement…</div>
</main>

<script src="/pain/pain.js"></script>
<script>
(async () => {
  const { catalogue, euro, esc } = PAIN;
  const $products = document.getElementById('products');

  try {
    const cat = await catalogue();
    $products.innerHTML = cat.produits.length
      ? cat.produits.map(p => `
        <article class="card">
          <div class="photos">
            <div class="photos-track">
              ${p.photos.length
                ? p.photos.map(url => `<img src="${esc(url)}" alt="${esc(p.nom)}" loading="lazy">`).join('')
                : '<div class="noimg"></div>'}
            </div>
            ${p.photos.length > 1 ? `<div class="dots">${p.photos.map((_, i) => `<button type="button" class="dot${i === 0 ? ' active' : ''}" aria-label="Photo ${i + 1}"></button>`).join('')}</div>` : ''}
          </div>
          <div class="body">
            <h2>${esc(p.nom)}</h2>
            ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ''}
            <p class="allergens">Allergènes : ${p.allergenes.length ? esc(p.allergenes.join(', ')) : 'aucun des 14 allergènes majeurs'}</p>
            <p class="price">${euro(p.prix)}</p>
          </div>
        </article>`).join('')
      : '<p class="empty">Aucun produit disponible pour le moment. Revenez bientôt !</p>';
    setupCarousels();
  } catch {
    $products.innerHTML = '<p class="error">Impossible de charger les produits. Réessayez dans un instant.</p>';
  }

  function setupCarousels() {
    document.querySelectorAll('.photos').forEach($photos => {
      const $track = $photos.querySelector('.photos-track');
      const dots = [...$photos.querySelectorAll('.dot')];
      if (!dots.length) return;
      dots.forEach((dot, i) => {
        dot.addEventListener('click', () => $track.scrollTo({ left: $track.clientWidth * i, behavior: 'smooth' }));
      });
      $track.addEventListener('scroll', () => {
        const i = Math.round($track.scrollLeft / $track.clientWidth);
        dots.forEach((d, j) => d.classList.toggle('active', j === i));
      });
    });
  }
})();
</script>
</body>
</html>
