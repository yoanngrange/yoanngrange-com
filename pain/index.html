<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Le pain des voisins du 4</title>
  <link rel="stylesheet" href="/pain/pain.css">
</head>
<body>
<main>
  <h1>Le pain des voisins du 4</h1>
  <p class="sub">Pétri, façonné et cuit avec amour au 16e, livré chez vous par ascenseur.</p>

  <div class="info">
    <p>📱 <a href="sms:+33643677814">Envoyez-moi un SMS au 06 43 67 78 14</a></p>
  </div>

  <div class="list" id="products">Chargement…</div>
</main>

<dialog id="desc-dialog">
  <h2 id="desc-dialog-title"></h2>
  <p id="desc-dialog-text"></p>
  <button type="button" id="desc-dialog-close">Fermer</button>
</dialog>

<script src="/pain/pain.js"></script>
<script>
(async () => {
  const { catalogue, euro, esc } = PAIN;
  const $products = document.getElementById('products');

  try {
    const cat = await catalogue();
    $products.innerHTML = cat.produits.length
      ? cat.produits.map(p => `
        <article class="card">
          <div class="photos">
            <div class="photos-track">
              ${p.photos.length
                ? p.photos.map(url => `<img src="${esc(url)}" alt="${esc(p.nom)}" loading="lazy">`).join('')
                : '<div class="noimg"></div>'}
            </div>
            ${p.photos.length > 1 ? `
              <button type="button" class="arrow prev" aria-label="Photo précédente">‹</button>
              <button type="button" class="arrow next" aria-label="Photo suivante">›</button>
            ` : ''}
          </div>
          <div class="body">
            <h2>${esc(p.nom)}</h2>
            ${p.description ? `<p class="desc" data-nom="${esc(p.nom)}" data-full="${esc(p.description)}"></p>` : ''}
            <p class="allergens">Allergènes : ${p.allergenes.length ? esc(p.allergenes.join(', ')) : 'aucun des 14 allergènes majeurs'}</p>
            <p class="price">${euro(p.prix)}</p>
          </div>
        </article>`).join('')
      : '<p class="empty">Aucun produit disponible pour le moment. Revenez bientôt !</p>';
    setupCarousels();
    setupDescriptions();
  } catch {
    $products.innerHTML = '<p class="error">Impossible de charger les produits. Réessayez dans un instant.</p>';
  }

  function setupCarousels() {
    document.querySelectorAll('.photos').forEach($photos => {
      const $prev = $photos.querySelector('.arrow.prev');
      const $next = $photos.querySelector('.arrow.next');
      if (!$prev) return;
      const $track = $photos.querySelector('.photos-track');
      const count = $track.children.length;
      const current = () => Math.round($track.scrollLeft / $track.clientWidth);
      const goTo = i => $track.scrollTo({ left: $track.clientWidth * Math.max(0, Math.min(count - 1, i)), behavior: 'smooth' });

      $prev.addEventListener('click', () => goTo(current() - 1));
      $next.addEventListener('click', () => goTo(current() + 1));
    });
  }

  // Descriptions are clamped to exactly two lines, with "[...]" as the last
  // word on the second line (not a separate line below) when text is
  // trimmed. Measured against the actual rendered width, so it holds at any
  // breakpoint. Opens a popover with the full text on click.
  function setupDescriptions() {
    const $dialog = document.getElementById('desc-dialog');
    const $title = document.getElementById('desc-dialog-title');
    const $text = document.getElementById('desc-dialog-text');
    document.getElementById('desc-dialog-close').addEventListener('click', () => $dialog.close());

    document.querySelectorAll('.desc').forEach($desc => {
      const full = $desc.dataset.full;
      $desc.textContent = full;
      if ($desc.scrollHeight <= $desc.clientHeight + 1) return; // fits fully, nothing to do

      const words = full.split(' ');
      let n = words.length - 1;
      for (; n > 0; n--) {
        $desc.innerHTML = `${esc(words.slice(0, n).join(' '))} <button type="button" class="more">[...]</button>`;
        if ($desc.scrollHeight <= $desc.clientHeight + 1) break;
      }
      $desc.querySelector('.more').addEventListener('click', () => {
        $title.textContent = $desc.dataset.nom;
        $text.textContent = full;
        $dialog.showModal();
      });
    });
  }
})();
</script>
</body>
</html>
