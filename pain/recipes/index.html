<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Recettes — Le pain des voisins du 4</title>
  <link rel="stylesheet" href="/pain/pain.css">
</head>
<body>
<main>
  <p class="back-link"><a href="/pain/">← Retour</a></p>
  <h1>Fiches recettes</h1>
  <p class="sub">Usage interne — tous les produits, publiés ou non. Pas de prix.</p>

  <div id="recipes">Chargement…</div>
</main>

<script src="/pain/pain.js"></script>
<script>
(async () => {
  const { recettes, esc } = PAIN;
  const $recipes = document.getElementById('recipes');

  function renderSections(sections, ordered) {
    if (!sections.length) return '<p class="empty small">Pas encore renseigné.</p>';
    const tag = ordered ? 'ol' : 'ul';
    return sections.map(s => `
      <h4>${esc(s.titre)}</h4>
      <${tag}>${s.items.map(i => `<li>${esc(i)}</li>`).join('')}</${tag}>
    `).join('');
  }

  try {
    const list = await recettes();
    $recipes.innerHTML = list.length ? list.map((p, i) => `
      <details class="recipe" id="recipe-${i}">
        <summary>
          <span class="recipe-nom">${esc(p.nom)}</span>
          ${!p.actif ? '<span class="badge">non publié</span>' : ''}
        </summary>
        <div class="recipe-body">
          ${p.photos.length ? `
            <div class="recipe-photos">
              ${p.photos.map(url => `<img src="${esc(url)}" alt="${esc(p.nom)}" loading="lazy">`).join('')}
            </div>
          ` : ''}
          <p class="allergens">Allergènes : ${p.allergenes.length ? esc(p.allergenes.join(', ')) : 'aucun des 14 allergènes majeurs'}</p>
          ${p.organigramme.length ? `
            <h3>Organigramme de production</h3>
            <div class="recipe-organigramme">
              ${p.organigramme.map(url => `<img src="${esc(url)}" alt="Organigramme de production — ${esc(p.nom)}" loading="lazy">`).join('')}
            </div>
          ` : ''}

          <h3>Ingrédients</h3>
          ${renderSections(p.ingredients, false)}

          <h3>Étapes</h3>
          ${renderSections(p.etapes, true)}

          <button type="button" class="print-btn" data-target="recipe-${i}">Imprimer / Exporter en PDF</button>
        </div>
      </details>
    `).join('') : '<p class="empty">Aucun produit.</p>';

    document.querySelectorAll('.print-btn').forEach($btn => {
      $btn.addEventListener('click', () => {
        document.querySelectorAll('.recipe').forEach($d => { $d.open = ($d.id === $btn.dataset.target); });
        window.print();
      });
    });
  } catch {
    $recipes.innerHTML = '<p class="error">Impossible de charger les recettes. Réessayez dans un instant.</p>';
  }
})();
</script>
</body>
</html>
