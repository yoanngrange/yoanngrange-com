    <div class="photo-modal" id="vegetalPhotoModal" aria-hidden="true" role="dialog" aria-label="Full image view" data-fr-aria-label="Vue détaillée de l’image">
      <div class="photo-modal__backdrop" data-close-vegetal-modal></div>
      <div class="photo-modal__content">
        <button class="photo-modal__close" type="button" aria-label="Close full image view" data-fr-aria-label="Fermer la vue détaillée" data-close-vegetal-modal>×</button>
        <img id="vegetalPhotoModalImage" src="" alt="">
      </div>
    </div>

    <script>
      (function () {
        const lang = document.documentElement.lang === 'fr' ? 'fr' : 'en';
        const monthsFr = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
        const monthsEn = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

        document.querySelectorAll('#vegetalGallery .photo-card[data-full]').forEach((card) => {
          const match = card.getAttribute('data-full').match(/(\d{4})-(\d{2})_\d+\.jpg$/);
          if (!match) return;
          const year = match[1];
          const monthIndex = parseInt(match[2], 10) - 1;
          const img = card.querySelector('img');

          if (lang === 'fr') {
            const monthFr = monthsFr[monthIndex];
            const monthFrCap = monthFr.charAt(0).toUpperCase() + monthFr.slice(1);
            card.setAttribute('data-title', `${monthFrCap} ${year}`);
            card.setAttribute('data-description', `Photo du jardin prise en ${monthFr} ${year}.`);
            card.setAttribute('aria-label', 'Voir l’image en détail');
            if (img) img.setAttribute('alt', `Photo de plantes, ${monthFr} ${year}`);
          } else {
            const monthEn = monthsEn[monthIndex];
            card.setAttribute('data-title', `${monthEn} ${year}`);
            card.setAttribute('data-description', `Garden photo taken in ${monthEn} ${year}.`);
            card.setAttribute('aria-label', 'View full image');
            if (img) img.setAttribute('alt', `Plant photo, ${monthEn} ${year}`);
          }
        });
      })();

      const vegetalModal = document.getElementById('vegetalPhotoModal');
      const vegetalModalImage = document.getElementById('vegetalPhotoModalImage');

      document.querySelectorAll('#vegetalGallery .photo-card').forEach((card) => {
        card.addEventListener('click', (event) => {
          event.preventDefault();
          vegetalModalImage.src = card.getAttribute('data-full');
          vegetalModalImage.alt = card.getAttribute('data-title');
          vegetalModal.classList.add('is-open');
          vegetalModal.setAttribute('aria-hidden', 'false');
        });
      });

      document.querySelectorAll('[data-close-vegetal-modal]').forEach((element) => {
        element.addEventListener('click', () => {
          vegetalModal.classList.remove('is-open');
          vegetalModal.setAttribute('aria-hidden', 'true');
        });
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          vegetalModal.classList.remove('is-open');
          vegetalModal.setAttribute('aria-hidden', 'true');
        }
      });

      const yearFilterButtons = Array.from(document.querySelectorAll('.year-filter-btn'));
      const galleryItems = Array.from(document.querySelectorAll('#vegetalGallery > [data-year]'));

      yearFilterButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const year = btn.getAttribute('data-year');
          yearFilterButtons.forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          galleryItems.forEach((item) => {
            const show = year === 'all' || item.getAttribute('data-year') === year;
            item.classList.toggle('d-none', !show);
          });
        });
      });
    </script>
